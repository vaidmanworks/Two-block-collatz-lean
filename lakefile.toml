name = "twoblock"
defaultTargets = ["TwoBlock"]

# Mathlib is pinned to one commit; `lake exe cache get` fetches its prebuilt files.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "a3a10db0e9d66acbebf76c5e6a135066525ac900"

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "TwoBlock"
